<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4d0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c0505;stop-opacity:1" />
    </radialGradient>
    
    <filter id="bevelEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="1" dy="2" in="SourceAlpha" result="offset" />
      <feGaussianBlur stdDeviation="1.5" in="offset" result="blur" />
      <feComposite operator="out" in="SourceGraphic" in2="blur" result="inverse" />
      <feFlood flood-color="black" flood-opacity="0.7" result="flood" />
      <feComposite operator="in" in="flood" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="245" fill="#1a1a1a" />
  <circle cx="256" cy="256" r="230" fill="#2b2b2b" stroke="#111" stroke-width="2"/>
  
