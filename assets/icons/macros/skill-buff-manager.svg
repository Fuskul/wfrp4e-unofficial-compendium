  <circle cx="65" cy="256" r="14" fill="#0a0a0a" />
  <circle cx="447" cy="256" r="14" fill="#0a0a0a" />

  <g fill="none" stroke="#c2b29a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#bevelEffect)">
    <circle cx="256" cy="160" r="40" stroke-opacity="0.6"/>
    <path d="M256 120 v80 M230 146 l26-26 26 26 M190 170 v40 M175 185 l15-15 15 15 M322 170 v40 M307 185 l15-15 15 15" opacity="0.6"/>
